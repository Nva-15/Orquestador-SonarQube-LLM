# Mismo proyecto Compose que D:\ProyectoRevisionCodigoIA para reutilizar los volúmenes
# (datos, proyectos y tokens de SonarQube). No cambiar "name".
name: proyectorevisioncodigoia

services:
  sonarqube:
    image: sonarqube:community
    container_name: sonarqube-revision-java
    ports:
      - "9000:9000"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_logs:/opt/sonarqube/logs
      - sonarqube_extensions:/opt/sonarqube/extensions
    restart: unless-stopped

volumes:
  sonarqube_data:
  sonarqube_logs:
  sonarqube_extensions:
