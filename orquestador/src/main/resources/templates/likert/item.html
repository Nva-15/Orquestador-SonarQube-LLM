<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragmentos :: head('Pregunta ' + ${posicion} + '/' + ${total}, false)}"></head>
<body>
<header th:replace="~{fragmentos :: menu('likert')}"></header>
<main class="ancho">
	<div class="navegacion">
		<nav class="miga" aria-label="Ruta">
			<a th:href="@{/likert}"><svg class="icono s"><use href="/iconos.svg#volver"/></svg>Cuestionarios</a>
			<span>/</span><span th:text="'Cuestionario ' + ${c.id}">Cuestionario 1</span>
		</nav>
		<div class="paginador">
			<a th:if="${anterior}" class="boton secundario pequeno" th:href="@{/likert/{c}/{i}(c=${c.id},i=${anterior})}">
				<svg class="icono s"><use href="/iconos.svg#izquierda"/></svg>Anterior</a>
			<span class="posicion">Participante <strong th:text="${codigo}">P1</strong> · pregunta
				<strong th:text="${posicion} + ' de ' + ${total}">1 de 1</strong></span>
		</div>
	</div>
	<div class="barra" role="progressbar" th:aria-valuenow="${hechas}" aria-valuemin="0" th:aria-valuemax="${total}">
		<div th:style="'width:' + ${hechas * 100 / total} + '%'"></div></div>
	<th:block th:replace="~{fragmentos :: avisos}"></th:block>

	<div class="comparacion">
		<section class="tarjeta neutra">
			<div class="grupo-banda"><span>Hallazgo</span><span class="regla" th:text="${h.regla}">java:S1</span></div>
			<div class="chips">
				<span class="ruta"><svg class="icono s"><use href="/iconos.svg#archivo"/></svg><span
						th:text="${h.archivo} + ':' + ${h.lineaInicio}">archivo:1</span></span>
			</div>
			<p class="mensaje cita" th:text="${h.mensaje}">mensaje</p>
			<th:block th:unless="${#lists.isEmpty(h.lineas())}"><div th:replace="~{fragmentos :: lineas(${h.lineas()})}"></div></th:block>
		</section>

		<section class="tarjeta neutra">
			<div class="grupo-banda"><span>Recomendación</span><svg class="icono s"><use href="/iconos.svg#info"/></svg></div>
			<p class="texto" th:text="${asignado.texto}">texto</p>
			<div class="seccion" th:if="${!#strings.isEmpty(asignado.codigo)}">
				<h3>Código propuesto</h3>
				<pre class="codigo propuesta" th:text="${asignado.codigo}">código</pre>
			</div>
		</section>
	</div>

	<section class="tarjeta">
		<div class="titulo">
			<h2>Tu valoración de la recomendación</h2>
			<span class="ayuda"><small>1 = muy en desacuerdo · 5 = muy de acuerdo</small></span>
		</div>
		<form method="post" th:action="@{/likert/{c}/{i}(c=${c.id},i=${asignado.item.id})}" class="formulario" data-principal>
			<div class="escala">
				<fieldset th:each="p : ${preguntas}">
					<legend><strong th:text="${p.dimension}">Claridad</strong><span th:text="${p.afirmacion}">afirmación</span></legend>
					<div class="puntos">
						<label class="punto" th:each="v : ${#numbers.sequence(1, 5)}">
							<input type="radio" th:name="${p.campo}" th:value="${v}" required
								   th:checked="${respuesta != null and respuesta[p.campo] == v}"
								   th:aria-label="${p.dimension} + ' ' + ${v}">
							<span><span th:text="${v}">1</span>
								<small th:text="${v == 1} ? 'Muy en desacuerdo' : (${v == 2} ? 'En desacuerdo' : (${v == 3} ? 'Neutral' : (${v == 4} ? 'De acuerdo' : 'Muy de acuerdo')))">etiqueta</small></span>
						</label>
					</div>
				</fieldset>
			</div>
			<label class="campo" for="comentario"><span>Comentario <small>(opcional)</small></span>
				<textarea id="comentario" name="comentario" rows="3" th:text="${respuesta?.comentario}"></textarea>
			</label>
			<div class="acciones">
				<button type="submit" class="primario">Guardar y siguiente<svg class="icono"><use href="/iconos.svg#derecha"/></svg></button>
				<span class="atajos"><span><kbd>Ctrl</kbd>+<kbd>Enter</kbd> guardar</span></span>
			</div>
		</form>
	</section>
</main>
</body>
</html>
